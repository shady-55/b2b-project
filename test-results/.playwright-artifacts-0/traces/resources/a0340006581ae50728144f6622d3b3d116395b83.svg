<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 810 540" width="810" height="540">
  <defs>
    <g id="star">
      <g id="cone">
        <polygon id="point" points="0,-30 0,0 8.64,-22.08" fill="#ffcc00"/>
        <use xlink:href="#point" transform="scale(-1,1)"/>
      </g>
      <use xlink:href="#cone" transform="rotate(72)"/>
      <use xlink:href="#cone" transform="rotate(144)"/>
      <use xlink:href="#cone" transform="rotate(216)"/>
      <use xlink:href="#cone" transform="rotate(288)"/>
    </g>
  </defs>
  <rect width="810" height="540" fill="#003399"/>
  <g transform="translate(405,270)">
    <use xlink:href="#star" transform="translate(0,-180)"/>
    <use xlink:href="#star" transform="rotate(30) translate(0,-180) rotate(-30)"/>
    <use xlink:href="#star" transform="rotate(60) translate(0,-180) rotate(-60)"/>
    <use xlink:href="#star" transform="rotate(90) translate(0,-180) rotate(-90)"/>
    <use xlink:href="#star" transform="rotate(120) translate(0,-180) rotate(-120)"/>
    <use xlink:href="#star" transform="rotate(150) translate(0,-180) rotate(-150)"/>
    <use xlink:href="#star" transform="translate(0,180)"/>
    <use xlink:href="#star" transform="rotate(210) translate(0,-180) rotate(-210)"/>
    <use xlink:href="#star" transform="rotate(240) translate(0,-180) rotate(-240)"/>
    <use xlink:href="#star" transform="rotate(270) translate(0,-180) rotate(-270)"/>
    <use xlink:href="#star" transform="rotate(300) translate(0,-180) rotate(-300)"/>
    <use xlink:href="#star" transform="rotate(330) translate(0,-180) rotate(-330)"/>
  </g>
</svg>
